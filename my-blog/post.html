<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章 · 我的博客</title>
<meta name="description" content="我的博客 —— 记录技术笔记、读书摘记与随想碎片的个人网站。">
<meta name="site-name" content="我的博客">
<meta property="og:type" content="article">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  var t = 'light';
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (!t) {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">我的博客</a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="archive.html">归档</a>
      <a href="about.html">关于</a>
    </nav>
    <button id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">🌙</button>
  </div>
</header>

<main class="wrap">
  <div id="post"><p class="muted">正在加载文章…</p></div>
  <nav id="post-nav" class="post-nav"></nav>
  <div id="comments"><!-- 可选：评论系统（Giscus）。到 giscus.app 生成脚本后粘贴到这里 --></div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-links">
      <a href="archive.html">归档</a>
      <a href="about.html">关于</a>
    </div>
    <p>© <span id="year">2026</span> 我的博客 · 由 <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a> 驱动</p>
  </div>
</footer>

<script src="js/blog.js"></script>
<script src="js/main.js"></script>
<script src="js/post.js"></script>
</body>
</html>
